<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pattern Prep | Login</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html">Pattern Prep</a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="login.html" aria-current="page">Login</a>
        <a href="register.html">Register</a>
        <a href="dashboard/dashboard.html">Dashboard</a>
        <a href="assessment/assessment.html">Assessment</a>
        <a href="learning/learning.html">Learning</a>
      </nav>
    </header>

    <main class="page-layout">
      <section class="hero-panel card">
        <div class="hero-main">
          <p class="eyebrow">Welcome back</p>
          <h1>Sign in to continue your preparation journey.</h1>
          <p class="hero-copy">Access your dashboard, resume practice sessions, and keep your learning progress in one place.</p>
        </div>

        <div class="auth-shell">
          <div class="auth-card">
            <h3>Login to your account</h3>
            <form id="login-form" class="auth-form">
              <label for="login-email">Email</label>
              <input id="login-email" name="email" type="email" placeholder="Email address" required />

              <label for="login-password">Password</label>
              <input id="login-password" name="password" type="password" placeholder="Password" required />

              <div class="auth-row">
                <label class="checkbox-row">
                  <input type="checkbox" />
                  <span>Remember Me</span>
                </label>
                <a class="text-link" href="#">Forgot Password?</a>
              </div>

              <button class="btn btn-primary" type="submit">Login</button>
            </form>
            <p id="login-status" class="login-status">New here? <a href="register.html">Create an account</a>.</p>
          </div>
        </div>
      </section>
    </main>

    <script src="login.js"></script>
  </body>
</html>
